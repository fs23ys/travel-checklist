  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="旅の準備">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#F5F3EE;min-height:100vh;padding-bottom:80px}
    #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F5F3EE;z-index:9999;gap:12px}
    .ld-spinner{width:40px;height:40px;border:4px solid #e0e0e0;border-top-color:#8B5CF6;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ld-text{font-size:14px;color:#888;font-weight:600}
    .ld-error{font-size:13px;color:#ef4444;background:#fee2e2;padding:14px;border-radius:10px;max-width:300px;text-align:center;line-height:1.7}
    #header{padding:10px 14px 0;position:sticky;top:0;z-index:100;box-shadow:0 6px 30px rgba(0,0,0,.22)}
    .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
    .eyebrow{font-size:9px;letter-spacing:.15em;color:rgba(255,255,255,.65);font-weight:700;margin-bottom:1px}
    h1{font-size:17px;font-weight:900;color:#fff}
    .hdr-right{display:flex;align-items:center;gap:6px}
    #sync-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.13);color:rgba(255,255,255,.7);white-space:nowrap}
    #sync-badge.saving{background:rgba(255,200,0,.25);color:#ffe066}
    #sync-badge.saved{background:rgba(100,220,100,.22);color:#86efac}
    #sync-badge.error{background:rgba(255,80,80,.22);color:#fca5a5}
    #reset-btn{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s}
    #reset-btn:hover{transform:rotate(90deg);background:rgba(255,255,255,.25)}
    .stats-row{display:flex;align-items:baseline;gap:3px;margin-bottom:6px;flex-wrap:wrap}
    .stat-num{font-size:19px;font-weight:900;color:#fff}
    .stat-sep,.stat-of{font-size:14px;color:rgba(255,255,255,.5)}
    .stat-lbl{font-size:11px;color:rgba(255,255,255,.5);margin-left:3px}
    .done-chip{margin-left:6px;font-size:10px;font-weight:700;background:rgba(134,239,172,.2);color:#86efac;padding:2px 7px;border-radius:99px}
    .hdr-toggle-btn{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.85);font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;cursor:pointer;font-family:inherit;margin-bottom:5px;transition:background .15s}
    .hdr-toggle-btn:hover{background:rgba(255,255,255,.22)}
    .hdr-toggle-btn .arr{font-size:9px;transition:transform .25s;display:inline-block}
    .hdr-toggle-btn .arr.open{transform:rotate(180deg)}
    .hdr-collapsible{overflow:hidden;transition:max-height .3s ease,opacity .25s ease;max-height:0;opacity:0}
    .hdr-collapsible.open{max-height:300px;opacity:1}
    .mode-row{display:flex;gap:6px;margin-bottom:7px;flex-wrap:wrap}
    .mode-pill{padding:5px 14px;border-radius:99px;border:none;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .22s}
    .cond-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding-bottom:8px}
    .cond-lbl{font-size:9px;color:rgba(255,255,255,.45);font-weight:600;margin-right:2px}
    .cond-chip{padding:3px 8px;border-radius:99px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;border:1.5px solid transparent;transition:all .18s}
    .bar-track{height:3px;background:rgba(255,255,255,.15)}
    .bar-fill{height:100%;transition:width .5s ease,background .3s}
    #main{padding:12px 10px;max-width:600px;margin:0 auto}
    .card{background:#fff;border-radius:13px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.065)}
    .cat-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-left:4px solid;cursor:pointer;user-select:none}
    .cat-head:hover{background:#fafafa}
    .cat-l,.cat-r{display:flex;align-items:center;gap:5px}
    .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .cat-lbl{font-size:13px;font-weight:800;color:#1a1a2e}
    .badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px}
    .all-btn{font-size:10px;background:transparent;border:1px solid #e0e0e0;border-radius:5px;padding:2px 6px;cursor:pointer;color:#999;font-weight:600;font-family:inherit}
    .all-btn:hover{background:#f0f0f0}
    .cat-eb{font-size:11px;background:transparent;border:none;color:#ccc;cursor:pointer;padding:2px 3px;border-radius:5px}
    .cat-eb:hover{background:#f0f0f0;color:#555}
    .cat-eb:disabled{opacity:.2;pointer-events:none}
    .chev{font-size:9px;color:#ccc}
    ul.item-list{list-style:none;border-top:1px solid #f0f0f0;padding:2px 0 4px}
    li.item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:2px solid transparent}
    li.item:hover{background:#f8f8f6}
    li.item.drag-over{background:rgba(139,92,246,.07)}
    .dh{flex-shrink:0;font-size:13px;color:#ccc;cursor:grab;opacity:0;padding:0 1px}
    li.item:hover .dh{opacity:1}
    .cb{width:21px;height:21px;border-radius:6px;border:2px solid #ddd;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;background:transparent}
    .il{font-size:13px;color:#2d2d2d;flex:1;line-height:1.4;cursor:pointer;word-break:break-all}
    .il.done{opacity:.35;text-decoration:line-through}
    .ag{display:flex;align-items:center;gap:1px;opacity:0;flex-shrink:0}
    li.item:hover .ag{opacity:1}
    .ib{width:24px;height:24px;border-radius:6px;border:none;background:transparent;color:#bbb;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;flex-shrink:0}
    .ib:hover{background:#f0f0f0;color:#555}
    .ib.del:hover{background:#fee2e2;color:#ef4444}
    .ib:disabled{opacity:.2;pointer-events:none}
    .atr{padding:4px 14px 8px}
    .atb{background:none;border:none;font-size:12px;font-weight:700;cursor:pointer;opacity:.5;padding:4px 0;font-family:inherit}
    .atb:hover{opacity:1}
    .cond-wrap{display:inline-flex;align-items:center;gap:2px}
    .cond-del{background:rgba(255,255,255,.15);border:none;color:rgba(255,255,255,.7);font-size:9px;cursor:pointer;border-radius:99px;padding:1px 4px;line-height:1;font-family:inherit}
    .cond-del:hover{background:rgba(255,80,80,.4);color:#fff}
    .cond-add-btn{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;border-radius:99px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0}
    .cond-add-btn:hover{background:rgba(255,255,255,.3)}
    .ar{display:flex;align-items:center;gap:6px;padding:8px 14px}
    .ai{flex:1;font-size:13px;padding:6px 10px;border:1.5px solid #e0e0e0;border-radius:7px;outline:none;background:#fafafa;font-family:inherit}
    .ac2{padding:6px 12px;border-radius:7px;border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
    .ax{padding:6px 9px;border-radius:7px;border:1px solid #e0e0e0;background:#f5f5f5;font-size:11px;cursor:pointer;color:#999;font-family:inherit}
    .add-cat-card{background:#fff;border-radius:13px;margin-bottom:10px;border:2px dashed #e0e0e0;display:flex;align-items:center;justify-content:center;padding:14px;cursor:pointer}

function allCats(){
  const m=M();
  const base=BASE[S.baseMode].filter(c=>!m.deletedCatIds.includes(c.id));
  const cond=condCats();
  const custom=m.customCats.filter(c=>!m.deletedCatIds.includes(c.id));
  let all=[...base,...cond,...custom];
  if(m.catListOrder.length){const om=Object.fromEntries(m.catListOrder.map((id,i)=>[id,i]));all.sort((a,b)=>(om[a.id]??9999)-(om[b.id]??9999));}
  return all.map(c=>({...c,label:c.isCondCat?(c.label):(m.customLabels["_cat_"+c.id]??c.label),color:c.isCondCat?(c.color):(m.customLabels["_col_"+c.id]??c.color),isCustom:c.isCustom||!!m.customCats.find(x=>x.id===c.id)}));
}
function visCats(){
  const m=M();const sh=SH();
  return allCats().map(cat=>{
    if(cat.isCondCat){
      // items already resolved in condCats(); just add checked state
      const items=cat.items.map(it=>({...it,checked:!!sh.condExtraItems[it.id]}));
      if(!items.length&&!cat.isCustom)return null;
      return{...cat,items};
    }
    const raw=(cat.items||[]).map((lb2,i)=>({id:cat.id+"_i"+i,label:typeof lb2==="string"?lb2:lb2.label})).filter(it=>!m.deletedIds.includes(it.id));
    const cust=(m.extraItems[cat.id]||[]).filter(i=>!m.deletedIds.includes(i.id));
    let items=[...raw,...cust];
    const ord=m.catOrder[cat.id];
    if(ord){const om=Object.fromEntries(ord.map((id,i)=>[id,i]));items.sort((a,b)=>(om[a.id]??9999)-(om[b.id]??9999));}
    if(!items.length&&!cat.isCustom)return null;
    return{...cat,items};
  }).filter(Boolean);
}
function toggle(id,isCondCat){
  if(isCondCat){const sh=SH();sh.condExtraItems[id]=sh.condExtraItems[id]?undefined:true;}
  else{M().checked[id]=!M().checked[id];}
  save();render();
}
function toggleCat(id){M().openCats[id]=!M().openCats[id];save();render();}
function setMode(mode){S.baseMode=mode;S.addingCat=null;render();}
function toggleCond(id){const sh=SH();const i=sh.conditions.indexOf(id);i>=0?sh.conditions.splice(i,1):sh.conditions.push(id);save();render();}
function chkAll(catId,items,isCondCat){
  if(isCondCat){const sh=SH();const allOn=items.every(i=>sh.condExtraItems[i.id]);items.forEach(i=>sh.condExtraItems[i.id]=allOn?undefined:true);}
  else{const on=items.every(i=>M().checked[i.id]);items.forEach(i=>M().checked[i.id]=!on);}
  save();render();
}
function addItem(catId,isCondCat){
  const label=S.addText.trim();if(!label){S.addingCat=null;render();return;}
  const id="c"+Date.now();
  if(isCondCat){const sh=SH();sh.condExtraItems[catId]=[...(sh.condExtraItems[catId]||[]),{id,label}];}
  else{const m=M();m.extraItems[catId]=[...(m.extraItems[catId]||[]),{id,label}];m.checked[id]=false;}
  S.addText="";S.addingCat=null;save();render();
}
function delItem(id,catId,isCondCat){
  if(isCondCat){const sh=SH();if(sh.condExtraItems[catId])sh.condExtraItems[catId]=sh.condExtraItems[catId].filter(i=>i.id!==id);if(!sh.condDeletedIds.includes(id))sh.condDeletedIds.push(id);}
  else{const m=M();if(m.extraItems[catId])m.extraItems[catId]=m.extraItems[catId].filter(i=>i.id!==id);if(!m.deletedIds.includes(id))m.deletedIds.push(id);delete m.checked[id];}
  save();render();
}
function openEM(id,label){S.showEM=true;S.emId=id;S.emText=label;render();}
function commitEM(){
  const label=S.emText.trim();if(!label||!S.emId)return;
  const sh=SH();const m=M();
  // check if it's a cond item
  const isCC=condCats().some(cat=>cat.items.some(it=>it.id===S.emId));
  if(isCC){sh.condCustomLabels[S.emId]=label;}
  else{m.customLabels[S.emId]=label;const ei=m.extraItems;for(const cid in ei)ei[cid]=ei[cid].map(i=>i.id===S.emId?{...i,label}:i);}
  S.showEM=false;S.emId=null;S.emText="";save();render();
}
function moveItem(catId,items,from,to){
  if(to<0||to>=items.length)return;
  const ids=items.map(i=>i.id);const[mv]=ids.splice(from,1);ids.splice(to,0,mv);
  const isCC=condCats().some(c=>c.id===catId);
  if(isCC)SH().condCatOrder[catId]=ids;else M().catOrder[catId]=ids;
  save();render();
}
function resetAll(){
  const c={};visCats().forEach(cat=>cat.items.forEach(i=>c[i.id]=false));M().checked=c;
  // also clear cond checks
  const sh=SH();condCats().forEach(cat=>cat.items.forEach(i=>{delete sh.condExtraItems[i.id];}));
  S.showReset=false;save();render();
}
function moveCat(catId,dir){const cats=allCats();const ids=cats.map(c=>c.id);const i=ids.indexOf(catId);const ni=i+dir;if(ni<0||ni>=ids.length)return;const[mv]=ids.splice(i,1);ids.splice(ni,0,mv);M().catListOrder=ids;save();render();}
function openCM(catId){
  const isNew=!catId;const cat=catId?allCats().find(c=>c.id===catId):null;
  S.showCM=true;S.cmNew=isNew;S.cmId=catId||null;
  const raw=cat?.label??"";
  const em=raw.match(/^(\p{Emoji_Presentation}|\p{Emoji}\uFE0F)/u);
  S.cmEmoji=em?em[0]:"📝";S.cmName=raw.replace(/^(\p{Emoji_Presentation}|\p{Emoji}\uFE0F)\s*/u,"").trim();S.cmColor=cat?.color??"#86EFAC";
  render();
}
function commitCM(){const name=S.cmName.trim();if(!name)return;const fullLabel=S.cmEmoji+" "+name;const m=M();if(S.cmNew){const id="cat_"+Date.now();m.customCats.push({id,label:fullLabel,color:S.cmColor,items:[]});m.openCats[id]=true;}else{m.customLabels["_cat_"+S.cmId]=fullLabel;m.customLabels["_col_"+S.cmId]=S.cmColor;}S.showCM=false;save();render();}
function delCat(catId){const m=M();if(!m.deletedCatIds.includes(catId))m.deletedCatIds.push(catId);m.customCats=m.customCats.filter(c=>c.id!==catId);S.showCM=false;save();render();}

入力..." value="${e(S.addText)}"><button class="ac2" data-ac="${cat.id}" data-acc2="${isCC?1:0}" style="background:${cat.color}">追加</button><button class="ax" data-acc="${cat.id}">✕</button></li>`:`<li class="atr"><button class="atb" data-at="${cat.id}" style="color:${cat.color}">＋ 項目を追加</button></li>`}</ul>`:""}</div>`;

    li.ondragstart=ev=>{S.dragId=li.dataset.iid;S.dragCat=li.dataset.icid;ev.dataTransfer.effectAllowed="move";};
    li.ondragover=ev=>{ev.preventDefault();if(S.dragOv!==li.dataset.iid){S.dragOv=li.dataset.iid;render();}};
    li.ondragend=()=>{if(S.dragId&&S.dragOv&&S.dragId!==S.dragOv&&S.dragCat){const isCC=li.dataset.icc==="1";const c=vc.find(c=>c.id===S.dragCat);if(c){const ids=c.items.map(i=>i.id);const fi=ids.indexOf(S.dragId),ti=ids.indexOf(S.dragOv);if(fi!==-1&&ti!==-1){const o=[...ids];const[mv]=o.splice(fi,1);o.splice(ti,0,mv);if(isCC)SH().condCatOrder[S.dragCat]=o;else M().catOrder[S.dragCat]=o;}}}S.dragId=null;S.dragOv=null;S.dragCat=null;save();render();};
  });
  if(S.addingCat){const inp=document.querySelector(`.ai[data-acat="${S.addingCat}"]`);if(inp)inp.focus();}
}
init();
</script>
