function e(s=""){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

  if(m.catListOrder.length){const om=Object.fromEntries(m.catListOrder.map((id,i)=>[id,i]));all.sort((a,b)=>(om[a.id]??9999)-(om[b.id]??9999));}

function visCats(){

    const cust=(m.extraItems[cat.id]||[]).filter(i=>!m.deletedIds.includes(i.id));
    let items=[...raw,...cust];
    const ord=m.catOrder[cat.id];
    if(ord){const om=Object.fromEntries(ord.map((id,i)=>[id,i]));items.sort((a,b)=>(om[a.id]??9999)-(om[b.id]??9999));}

  q("[data-ac]").forEach(el=>el.onclick=()=>addItem(el.dataset.ac));
  q("[data-acc]").forEach(el=>el.onclick=()=>{S.addingCat=null;S.addText="";render();});
  q("li.item[draggable]").forEach(li=>{
    li.ondragstart=ev=>{S.dragId=li.dataset.iid;S.dragCat=li.dataset.icid;ev.dataTransfer.effectAllowed="move";};
    li.ondragover=ev=>{ev.preventDefault();if(S.dragOv!==li.dataset.iid){S.dragOv=li.dataset.iid;render();}};
    li.ondragend=()=>{if(S.dragId&&S.dragOv&&S.dragId!==S.dragOv&&S.dragCat){const c=vc.find(c=>c.id===S.dragCat);if(c){const ids=c.items.map(i=>i.id);const fi=ids.indexOf(S.dragId),ti=ids.indexOf(S.dragOv);if(fi!==-1&&ti!==-1){const o=[...ids];const[mv]=o.splice(fi,1);o.splice(ti,0,mv);M().catOrder[S.dragCat]=o;}}}S.dragId=null;S.dragOv=null;S.dragCat=null;save();render();};
  });
  if(S.addingCat){const inp=document.querySelector(`.ai[data-acat="${S.addingCat}"]`);if(inp)inp.focus();}
}
init();
</script>
</body>
